url: https://ehrlinger.github.io/hvtiRtables/
template:
  bootstrap: 5
  bslib:
    bootswatch: zephyr
    base_font: {google: "Outfit"}
    code_font: {google: "Fira Code"}
  light-switch: true
  theme: atom-one-light
  theme-dark: atom-one-dark

home:
  sidebar:
    structure: [badges, links, authors]
    components:
      badges:
        title: Package badges
        text: |
          ![](https://img.shields.io/github/r-package/v/ehrlinger/hvtiRtables)<br>
          ![](https://img.shields.io/github/actions/workflow/status/ehrlinger/hvtiRtables/pkgdown.yaml)<br>

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, my_linkedin, lightswitch]
  components:
    my_linkedin:
      icon: fa-linkedin
      href: https://www.linkedin.com/in/ehrlinger/
      aria-label: LinkedIn

reference:
- title: "1. Compute the table — `%summarytable`"
  desc: >
    Where the macro's `CON*=`, `CAT*=`, `LIST=`, `PP=`, `PVALUES=` and
    `TOTALCOL=` land. Takes a grouped, ordered variable list and returns a
    `gtsummary` object for the stages below.
  contents:
  - hv_tbl_summary

- title: "2. Shape the table — `STYLE=` / `PAGE=`"
  desc: >
    House style is fixed, so the only choice here is the header shape.
    Flat single-row headers for CORR reports and manuscripts; merged
    spanning headers for a JTCVS submission.
  contents:
  - hv_man_table
  - hv_man_table_jtcvs

- title: "3. Write the document — `RTFFILE=` / `PDFFILE=`"
  desc: >
    The macro's output block: `TBLTITLE=` becomes `caption`, `ADDFN=` and
    `PRINTFN=` become `footnotes`. Output is always `.docx`.
  contents:
  - hv_man_table_save
  - hv_man_table_save_jtcvs
  - hv_man_footnotes
  - hv_test_footnotes_jtcvs

- title: "4. Verify the written file"
  desc: >
    No macro analogue. Inspects a written `.docx` for structural layers the
    manuscript rules prohibit, reading the file rather than the object that
    produced it — so it catches anything introduced later, including by a
    hand edit.
  contents:
  - hv_check_docx

- title: "Package overview"
  desc: >
    Which rendering mode to use, and both pipelines end to end.
  contents:
  - hvtiRtables-package

articles:
- title: "Guides"
  navbar: ~
  contents:
  - hvtiRtables
  - sas-migration

footer:
  structure:
    left: developed_by
    right: built_with_pkgdown
  components:
    developed_by: "John Ehrlinger"
    built_with_pkgdown: "This site was built using [pkgdown](https://pkgdown.r-lib.org/)!&nbsp;&nbsp;<img src='https://pkgdown.r-lib.org/logo.png' alt='pkgdown logo' width='25'>"
